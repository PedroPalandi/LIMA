<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>Cadastro</title>
</head>
<body>
    <h1>Formulário de Cadastro</h1>
    <form action="https://webhook.site/dd8cf42d-081c-431b-9cae-9ddd812efd7b"method="post">
    <label for="nome">Nome</label>
        <input 
        type="text" 
        name="nome" 
        id="nome" 
        required 
        minlength="2"
        maxlength="50"
        placeholder="Digite seu nome"
        >
        <br><br>
    <label for="e-mail">E-mail</label>
        <input 
        type="email" 
        name="email" 
        id="email" 
        required
        placeholder="exemplo@dominio.com"
        >
        <br><br>
    <label for="telefone">Telefone</label>
        <input 
        type="tel" 
        name="telefone" 
        id="telefone" 
        required
        placeholder="(XX) XXXXX-XXXX"
        pattern="\(\d{2}\) \d{4,5}-\d{4}" 
        >
        <br><br>
    <label for="Idade">Idade</label>
        <input 
        type="number" 
        name="idade" 
        id="idade" 
        required 
        min="18"
        max="120"
        step="1"
        >
        <br><br>
    <label for="data-nascimento">Data de Nascimento</label>
        <input 
        type="date" 
        name="data-nascimento" 
        id="data-nascimento" 
        required 
        min="1900-01-01"
        max="2026-07-24"
        >
        <br><br>
    <label for="website">Página Pessoal</label>
        <input 
        type="url" 
        name="website" 
        id="website"
        placeholder="https://www.seusite.com"
        >
        <br><br>
    <label for="comentarios">Comentários</label>
        <textarea  
        name="comentarios" 
        id="comentarios"
        rows="4"
        cols="50"
        maxlength="500"
        placeholder="Digite seu comentário aqui"
        ></textarea>
        <br><br>

        <button type="submit">Cadastrar</button>
        
    </form>
</body>
</html>
